
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Омегабуд — Адміністрування</title>

  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/grapesjs"></script>
</head>
<body>
  <main class="login-wrap" id="loginScreen">
    <section class="login-card">
      <div class="logo">ОМЕГАБУД</div>
      <h1>Панель керування сайтом</h1>
      <p>Увійдіть, щоб редагувати сайт компанії.</p>

      <form id="loginForm">
        <label for="email">Електронна пошта</label>
        <input id="email" autocomplete="username" type="email" required placeholder="Ваша електронна пошта">

        <label for="password">Пароль</label>
        <input id="password" autocomplete="current-password" type="password" required placeholder="Ваш пароль">

        <button type="submit" id="loginButton">Увійти</button>
        <div id="message" role="status"></div>
      </form>
    </section>
  </main>

  <div id="adminApp" style="display:none"></div>

  <script src="workspace.js"></script>
  <script src="admin.js"></script>
</body>
</html>
