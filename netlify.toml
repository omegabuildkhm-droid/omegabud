[build]
  command = "npm run build"
  publish = "dist"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"


# Keep existing links and search results on the canonical custom domain.
[[redirects]]
  from = "https://tiny-truffle-95ce1a.netlify.app/*"
  to = "https://omegabud.km.ua/:splat"
  status = 301
  force = true
